# Leonard project-local config. Only the keys below are read at
# runtime (see internal/config/config.go). Bughunt-2 Theme A trimmed
# the schema to what the code actually consumes; the audit trail
# lives in audits/bughunt-2-triage.md.
#
# All fields are optional — Leonard's defaults match the values
# you'd get from a fresh `leonard init`.

[hooks]
# How many recent decisions to inject into a new Claude Code session.
inject_decisions_at_session_start = 10
# How many unverified claims to surface at Stop time.
surface_unverified_claims_at_stop = 20

# Opt-in per-project verifier. When `command` is set, the post-edit
# hook runs it through `sh -c` instead of the default `go vet ./...`
# auto-detection. Leave the whole section out (or `command = ""`)
# to fall back to the v0.1 behavior.
# [post_edit.verify]
# command     = "cargo check --workspace"   # required: runs through sh -c
# working_dir = ""                            # optional: defaults to project root
# timeout     = "60s"                         # optional: time.ParseDuration; positive only
