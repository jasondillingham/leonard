[package]
name = "leonard-extract-treesitter"
version = "0.1.0"
edition = "2021"
description = "Tree-sitter–based symbol extractor for Leonard. Receives source on stdin, emits Leonard's Symbol JSON shape on stdout. One binary, multi-language: --lang java|kotlin|... selects the grammar."
publish = false

[[bin]]
name = "leonard-extract-treesitter"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.25"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-scala = "0.24"
tree-sitter-dart = "0.0.4"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-php = "0.23"
tree-sitter-lua = "0.4"
tree-sitter-bash = "0.25"
tree-sitter-zig = "1.1"
tree-sitter-nix = "0.0.2"
tree-sitter-elixir = "0.3"
tree-sitter-solidity = "1.2"
tree-sitter-make = "1.1"
tree-sitter-cmake = "0.7"
tree-sitter-hcl = "1.1"
tree-sitter-graphql = "0.1"
tree-sitter-proto = "0.2"
tree-sitter-sequel = "0.3"
tree-sitter-wit = "0.2"
tree-sitter-erlang = "0.14"
tree-sitter-r = "1.1"
# tree-sitter-smithy 0.0.1 pins tree-sitter v0.20 which is
# incompatible with v0.25; ship WIT only and revisit when a
# compatible Smithy grammar appears on crates.io.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
