path_filters:
  - path_pattern: "customers/([^/]+)/"
    forbidden_values:
      - acme-corp
    reason: "NDA in place; no public artifacts under customers/acme-corp/"

  - path_pattern: "drafts/secrets/"
    reason: "Operator-only directory; not for Claude edits"

content_filters:
  - content_pattern: "(?i)bid on contract"
    required: "Disclose existing competitive arrangement (see disclosures.md)"

  - content_pattern: "(?i)guaranteed uptime"
    required: "past-90-days uptime cited from facts.yaml"
