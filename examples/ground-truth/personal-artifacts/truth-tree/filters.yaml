path_filters:
  # Companies the operator has ruled out — typically compensation
  # gap, values mismatch, or location constraint. Override with
  # `leonard override --once --reason "..."` if circumstances
  # change.
  - path_pattern: "applications/([^/]+)/"
    forbidden_values:
      - example-rejected-co
    reason: "Comp band below floor (see compensation_floor in facts.yaml)"

content_filters:
  # Salary-mention guard: when an artifact mentions salary, require
  # an explicit floor citation so the operator doesn't accidentally
  # lowball.
  - content_pattern: "(?i)(salary|compensation) expectations?"
    required: "see compensation_floor in facts.yaml"
